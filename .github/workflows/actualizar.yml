name: Actualizar Blue Diamond Automatico

on:
  schedule:
    - cron: '0 10 * * *' # 5:00 AM hora Perú
    - cron: '0 18 * * *' # 1:00 PM hora Perú
    - cron: '2 0 * * *'  # 9:00 PM hora Perú
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2

      - name: Descargar partidos reales y actualizar app
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const fetch = require('node-fetch');

          async function actualizar() {
            const apiKey = process.env.FOOTBALL_API_KEY;
            const hoy = new Date().toISOString().split('T')[0];
            console.log('Consultando API para la fecha:', hoy);

            try {
              const response = await fetch(\`https://v3.football.api-sports.io/fixtures?date=\${hoy}\`, {
                headers: {
                  'x-apisports-key': apiKey
                }
              });
              const data = await response.json();
              console.log('Partidos encontrados:', data.results);

              // Lee index.html y actualiza los datos
              let html = fs.readFileSync('index.html', 'utf8');
              // Inserta los datos frescos de la API en el archivo
              const datosInyectados = \`<script>window.PARTIDOS_HOY = \${JSON.stringify(data.response || [])};</script>\`;
              html = html.replace('<!-- DATOS_API -->', datosInyectados);
              
              fs.writeFileSync('index.html', html);
              console.log('index.html actualizado exitosamente.');
            } catch (error) {
              console.error('Error al consultar API:', error);
            }
          }
          actualizar();
          "

      - name: Guardar cambios y publicar
        run: |
          git config --global user.name "GitHub Action Robot"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "🤖 Actualización automática con datos reales API" || exit 0
          git push
